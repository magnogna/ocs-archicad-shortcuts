[package]
name = "ocs-archicad-shortcuts"
version = "0.1.0"
edition = "2021"
description = "Archicad (Windows) style keyboard shortcuts for Open CAD Studio, driving the native MOVE/COPY/ROTATE/MIRROR commands."
license = "GPL-3.0-only"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# Stable plugin contract (host feature = HostApi / BuiltinPlugin / export_plugin!).
# Pinned to the host commit this plugin was written and reviewed against
# (API v10, release v2026.42). Its own `acadrust` pin (rev 5d4f11a) is the host's codec pin, so
# Cargo.lock resolves the same opencadcodec the host was built with.
ocs_plugin_api = { git = "https://github.com/HakanSeven12/OpenCADStudio", rev = "b6fbac39ffc74398ba5d283ce2bc1dc07a8fd8f0", features = ["host"] }

[profile.release]
strip = true
